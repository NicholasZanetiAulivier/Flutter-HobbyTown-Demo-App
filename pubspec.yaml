name: hobby_town_demo
description: "Demo for hobby town user app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_floating_bottom_bar: 3.1.0
  riverpod: ^3.5.0
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: resources/fonts/jakarta/PlusJakartaSans-VariableFont_wght.ttf
        - asset: resources/fonts/jakarta/PlusJakartaSans-Italic-VariableFont_wght.ttf
          style: italic